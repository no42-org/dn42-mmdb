name: Weekly MMDB Release

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      registry_url:
        # No default: the inputs context is populated with declared defaults on
        # workflow_dispatch and empty on schedule, so a default here would always
        # win the || chain below and silently mask DN42_REGISTRY_URL on manual
        # runs. The trailing literal in that chain supplies the default instead.
        description: 'DN42 registry git repository URL (overrides DN42_REGISTRY_URL)'
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gates:
    name: Quality Gates
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write

  release:
    name: Build and Release MMDB
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify build environment
        run: make verify

      - name: Shallow clone DN42 registry
        uses: ./.github/actions/clone-registry
        with:
          registry-url: ${{ inputs.registry_url || secrets.DN42_REGISTRY_URL || vars.DN42_REGISTRY_URL || 'https://git.dn42.dev/dn42/registry.git' }}
          registry-token: ${{ secrets.DN42_REGISTRY_TOKEN }}

      # One invocation: the database targets are phony, so a separate
      # `make checksum` run would rebuild every database before hashing it.
      - name: Build MMDB databases and checksums
        run: make build checksum REGISTRY=registry

      - name: Set up Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign release artifacts
        run: |
          for db in dn42-asn.mmdb dn42-country.mmdb dn42-city.mmdb; do
            cosign sign-blob --yes --bundle "$db.sig" "$db"
          done

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dn42-asn.mmdb
            dn42-asn.mmdb.sha256
            dn42-country.mmdb
            dn42-country.mmdb.sha256
            dn42-city.mmdb
            dn42-city.mmdb.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date -u +%Y.%m.%d)"
          ASSETS="dn42-asn.mmdb dn42-asn.mmdb.sha256 dn42-asn.mmdb.sig \
                  dn42-country.mmdb dn42-country.mmdb.sha256 dn42-country.mmdb.sig \
                  dn42-city.mmdb dn42-city.mmdb.sha256 dn42-city.mmdb.sig \
                  sbom.spdx.json"
          # shellcheck disable=SC2086
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $ASSETS --clobber
          else
            gh release create "$TAG" $ASSETS \
              --title "DN42 MMDB $TAG" \
              --notes "Weekly automated build from the DN42 registry: ASN, country and city databases."
          fi
