name: Weekly MMDB Release

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      registry_url:
        description: 'DN42 registry git repository URL'
        required: false
        default: 'https://git.dn42.dev/dn42/registry.git'

permissions:
  contents: read

jobs:
  release:
    name: Build and Release MMDB
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify build environment
        run: make verify

      - name: Shallow clone DN42 registry
        env:
          GIT_TERMINAL_PROMPT: '0'
          REGISTRY_URL: ${{ inputs.registry_url || secrets.DN42_REGISTRY_URL || vars.DN42_REGISTRY_URL || 'https://git.dn42.dev/dn42/registry.git' }}
          REGISTRY_TOKEN: ${{ secrets.DN42_REGISTRY_TOKEN }}
        run: |
          if [ -n "$REGISTRY_TOKEN" ]; then
            AUTH_URL="${REGISTRY_URL/https:\/\//https://${REGISTRY_TOKEN}@}"
            git -c http.extraheader="" clone --depth 1 "$AUTH_URL" registry
          else
            if ! git -c http.extraheader="" clone --depth 1 "$REGISTRY_URL" registry; then
              echo "Error: Failed to clone DN42 registry from $REGISTRY_URL" >&2
              echo "If accessing git.dn42.dev, ensure DN42_REGISTRY_TOKEN secret is configured." >&2
              exit 1
            fi
          fi

      - name: Build MMDB database
        run: make build REGISTRY=registry OUTPUT=dn42-asn.mmdb

      - name: Generate SHA-256 checksum
        run: make checksum OUTPUT=dn42-asn.mmdb

      - name: Set up Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign release artifact
        run: |
          cosign sign-blob --yes --bundle dn42-asn.mmdb.sig dn42-asn.mmdb

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dn42-asn.mmdb
            dn42-asn.mmdb.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date -u +%Y.%m.%d)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dn42-asn.mmdb dn42-asn.mmdb.sha256 dn42-asn.mmdb.sig sbom.spdx.json --clobber
          else
            gh release create "$TAG" dn42-asn.mmdb dn42-asn.mmdb.sha256 dn42-asn.mmdb.sig sbom.spdx.json \
              --title "DN42 MMDB $TAG" \
              --notes "Weekly automated build of dn42-asn.mmdb from the DN42 registry."
          fi
