name: Weekly MMDB Release

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build and Release MMDB
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify build environment
        run: make verify

      - name: Shallow clone DN42 registry
        run: git clone --depth 1 https://git.dn42.dev/dn42/registry.git registry

      - name: Build MMDB database
        run: make build REGISTRY=registry OUTPUT=dn42-asn.mmdb

      - name: Generate SHA-256 checksum
        run: make checksum OUTPUT=dn42-asn.mmdb

      - name: Set up Cosign
        uses: sigstore/cosign-installer@c56c2d3e59e4281cc41dea2217323ba5694b171e  # v3.8.0

      - name: Sign release artifact
        run: |
          cosign sign-blob --yes --bundle dn42-asn.mmdb.sig dn42-asn.mmdb

      - name: Generate SBOM
        uses: anchore/sbom-action@df80a981bc6edbc4e220a492d3cbe9f5547a6e75  # v0.17.9
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@520d128f165991a6c774bcb264f323e3d70747f4  # v2.2.0
        with:
          subject-path: |
            dn42-asn.mmdb
            dn42-asn.mmdb.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date -u +%Y.%m.%d)"
          gh release create "$TAG" dn42-asn.mmdb dn42-asn.mmdb.sha256 dn42-asn.mmdb.sig sbom.spdx.json \
            --title "DN42 MMDB $TAG" \
            --notes "Weekly automated build of dn42-asn.mmdb from git.dn42.dev/dn42/registry." \
            --clobber
