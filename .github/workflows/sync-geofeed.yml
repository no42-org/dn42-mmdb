name: Sync Geofeed Snapshot

# Three hours ahead of the release, and declared separately: this workflow
# reaches third-party networks and the release workflow must not. The head
# start lets the snapshot PR run CI and auto-merge before the release clones
# main, so a refreshed snapshot ships the same Monday. Deliberately no
# pull_request trigger, so no untrusted fork run can reach the tailnet.
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      registry_url:
        # No default: the inputs context is populated with declared defaults on
        # workflow_dispatch and empty on schedule, so a default here would
        # always win the || chain below and mask DN42_REGISTRY_URL.
        description: 'DN42 registry git repository URL (overrides DN42_REGISTRY_URL)'
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gates:
    name: Quality Gates
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write

  sync:
    name: Refresh Geofeed Snapshot
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      # Lifted to job level so the Tailscale step can test for them: the
      # secrets context is not available in a step-level `if:`. Both are
      # checked, because a half-configured pair would otherwise run the step
      # with an empty credential, fail, be swallowed by continue-on-error and
      # look exactly like a successful degraded run.
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_CLIENT_SECRET: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
      # Same reason, for the GitHub App below. Only the verdict is lifted, so
      # the private key stays out of the job environment.
      SYNC_APP_CONFIGURED: ${{ vars.SYNC_APP_ID != '' && secrets.SYNC_APP_PRIVATE_KEY != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Shallow clone DN42 registry
        uses: ./.github/actions/clone-registry
        with:
          registry-url: ${{ inputs.registry_url || secrets.DN42_REGISTRY_URL || vars.DN42_REGISTRY_URL || 'https://git.dn42.dev/dn42/registry.git' }}
          registry-token: ${{ secrets.DN42_REGISTRY_TOKEN }}

      # Reaches dn42 through the maintainer's peer, which advertises
      # 172.20.0.0/14 and fd00::/8 into the tailnet as a subnet router.
      #
      # Skipped when no credential is configured, which is the case in every
      # fork, and never fatal: without it the sync still collects every
      # clearnet-reachable feed, and feeds it cannot reach keep the rows the
      # committed snapshot already has.
      - name: Join the tailnet for dn42 reachability
        if: env.TS_OAUTH_CLIENT_ID != '' && env.TS_OAUTH_CLIENT_SECRET != ''
        continue-on-error: true
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888  # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci-dn42
          # --accept-routes is passed by the action itself; repeating it makes
          # `tailscale up` reject the whole invocation as a duplicate flag.
          #
          # --accept-dns applies whatever the tailnet pushes. The tailnet must
          # therefore restrict its nameserver to the `dn42` domain: a global
          # nameserver would route every later step's resolution through it,
          # and those steps have no continue-on-error to fall back on.
          args: --accept-dns=true

      # Says why a run did or did not reach dn42. Without this the only
      # signal is "N fetched, M unreachable", which cannot distinguish an
      # unapproved route from missing split DNS from a blocking ACL.
      - name: Report dn42 reachability
        if: env.TS_OAUTH_CLIENT_ID != '' && env.TS_OAUTH_CLIENT_SECRET != ''
        continue-on-error: true
        run: |
          # Tailscale installs accepted subnet routes into table 52 with ip
          # rules, not the main table, so `ip route` alone reports nothing and
          # looks like a missing route. `ip route get` follows the rules.
          echo "route main: $(ip -4 route | grep -cE '^172\.(2[0-3])\.' || true) dn42 route(s) in the main table"
          echo "route t52 : $(ip -4 route show table 52 2>/dev/null | grep -cE '^172\.(2[0-3])\.' || true) dn42 route(s) in table 52"
          printf 'route get : '; ip -4 route get 172.20.129.3 2>&1 | head -1
          echo "dns scope : $(resolvectl status tailscale0 2>/dev/null | grep -ci 'dn42' || true) dn42 reference(s)"
          resolvectl status tailscale0 2>/dev/null | grep -iE 'DNS Servers|DNS Domain|Current Scopes' | sed 's/^/            /'
          for h in burble.dn42 franta.dn42; do
            addr=$(getent hosts "$h" 2>/dev/null | awk '{print $1}' | head -1)
            printf 'resolve   : %-16s %s\n' "$h" "${addr:-NO RESOLVE}"
          done
          printf 'connect   : burble:443     '
          timeout 8 bash -c '</dev/tcp/172.20.129.3/443' 2>/dev/null && echo open || echo "unreachable"
          # Which tag did this node actually get, and is the subnet router
          # offering us its routes? A tag mismatch and an ACL that does not
          # permit the CIDR look identical from the fetch results alone.
          cat > /tmp/tsdiag.py <<'PYEOF'
          import json, sys
          d = json.load(sys.stdin)
          s = d.get("Self", {})
          print("node tags :", s.get("Tags") or "NONE - the ACL rule cannot match")
          peers = d.get("Peer") or {}
          print("peers seen:", len(peers))
          for p in peers.values():
              if p.get("HostName") != "melee":
                  continue
              # AllowedIPs is what WireGuard will actually route to this peer.
              # PrimaryRoutes is only what the peer advertises; a packet is
              # dropped unless some peer claims its destination here.
              print("melee      : online=%s active=%s" % (p.get("Online"), p.get("Active")))
              print("  primary  :", p.get("PrimaryRoutes") or "none")
              print("  allowedIP:", p.get("AllowedIPs") or "none")
              print("  relay    :", p.get("Relay"), "curAddr:", p.get("CurAddr") or "(derp)")
          PYEOF
          tailscale status --json 2>/dev/null | python3 /tmp/tsdiag.py || echo "(status unavailable)"
          # Does the tunnel itself carry traffic, and via which peer?
          printf 'ts ping melee : '; timeout 15 tailscale ping --c 2 --timeout 5s melee 2>&1 | tail -1
          printf 'ts ping burble: '; timeout 15 tailscale ping --c 2 --timeout 5s 172.20.129.3 2>&1 | tail -1
          # Probe whichever resolver the tailnet actually pushed, rather than
          # a hard-coded address: the dn42 anycast recursors were retired in
          # favour of the subnet router's own CoreDNS, and a fixed probe would
          # report a failure against an address nothing uses any more.
          RESOLVER=$(resolvectl status tailscale0 2>/dev/null \
                     | awk '/DNS Servers:/{print $3; exit}')
          echo "resolver  : ${RESOLVER:-none pushed by the tailnet}"
          if [ -n "$RESOLVER" ]; then
            printf 'tcp 53    : '
            timeout 8 bash -c "</dev/tcp/$RESOLVER/53" 2>/dev/null \
              && echo "reachable" || echo "unreachable"
            printf 'udp 53    : '
            RESOLVER="$RESOLVER" timeout 10 python3 -c '
          import os, socket, struct
          q = struct.pack("!HHHHHH", 0x1234, 0x0100, 1, 0, 0, 0)
          for label in (b"burble", b"dn42"):
              q += bytes([len(label)]) + label
          q += b"\x00" + struct.pack("!HH", 1, 1)
          s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.settimeout(6)
          try:
              s.sendto(q, (os.environ["RESOLVER"], 53))
              data, _ = s.recvfrom(512)
              print("answer received, ancount=%d" % struct.unpack("!H", data[6:8])[0])
          except Exception as exc:
              print("no answer: %s: %s" % (type(exc).__name__, exc))
          ' 2>&1 | tail -1
          fi
          printf 'resolvectl    : '; resolvectl query burble.dn42 2>&1 | tail -1

      # Feeds on *.dn42 hostnames need the step above to have succeeded. Without
      # it the tool reports them unreachable and keeps their existing rows, so a
      # partial fetch narrows the snapshot rather than emptying it. The summary
      # line reports how many feeds were fetched and how many were unreachable.
      - name: Refresh the geofeed snapshot
        run: make sync REGISTRY=registry

      # A PR pushed with GITHUB_TOKEN never triggers other workflows, so the
      # required CI check would not run and the PR would sit blocked until a
      # human pushed to it. An installation token from a GitHub App has no
      # such restriction. Forks without the App fall back to GITHUB_TOKEN and
      # keep the old behaviour: the PR opens, CI needs a manual nudge.
      - name: Mint a GitHub App token
        id: app-token
        if: env.SYNC_APP_CONFIGURED == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ vars.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open a pull request when the snapshot changed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # --porcelain, not `git diff`: the snapshot may be untracked, and
          # `git diff` reports no change for a file git has never seen.
          if [ -z "$(git status --porcelain -- data/geofeed.csv)" ]; then
            echo "Geofeed snapshot unchanged, nothing to propose."
            exit 0
          fi

          # Run id in the branch name: a second run on the same UTC day would
          # otherwise push non-fast-forward to an existing branch and fail.
          BRANCH="geofeed-sync/$(date -u +%Y.%m.%d)-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add data/geofeed.csv
          git commit -s -m 'chore(geofeed): refresh RFC 8805 snapshot from the registry' \
            -m 'Automated refresh. Rows outside their declaring inetnum are rejected by tools/sync_geofeed.py.' \
            -m 'Assisted-by: GitHubActions:sync-geofeed'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" "HEAD:$BRANCH"

          cat > /tmp/pr-body.md <<'BODY'
          Automated refresh of `data/geofeed.csv` from geofeeds declared in the DN42 registry.

          These rows come from third-party URLs. `tools/sync_geofeed.py` rejects any row naming space outside the `inetnum` that declared the feed, and `build_geo_mmdb.py` re-applies that check at build time.

          Auto-merge is enabled: this squash-merges as soon as CI is green and becomes part of the next weekly `dn42-city.mmdb`.
          BODY

          PR_URL=$(gh pr create --head "$BRANCH" --base "${GITHUB_REF_NAME}" \
            --title 'chore(geofeed): refresh RFC 8805 snapshot' \
            --body-file /tmp/pr-body.md)

          # Needs "Allow auto-merge" in the repository settings. A fork without
          # it still gets the PR, so do not fail the run over the merge.
          gh pr merge --auto --squash "$PR_URL" \
            || echo "::warning::Could not enable auto-merge on $PR_URL; merge it by hand."
