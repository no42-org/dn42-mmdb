# TEMPORARY diagnostic. Verifies that a runner can reach dn42 through the
# tailnet before the sync workflow is merged. Reports only: no commits, no
# pull requests, nothing published. Delete once the path is confirmed.
name: DN42 Reachability Probe

on:
  push:
    branches: [ feat/dn42-network-access ]

permissions:
  contents: read

jobs:
  probe:
    name: Probe dn42 from a runner
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_CLIENT_SECRET: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.x'

      - name: Report credential presence
        run: |
          echo "client id set:     $([ -n "$TS_OAUTH_CLIENT_ID" ] && echo yes || echo NO)"
          echo "client secret set: $([ -n "$TS_OAUTH_CLIENT_SECRET" ] && echo yes || echo NO)"

      - name: Join the tailnet
        if: env.TS_OAUTH_CLIENT_ID != '' && env.TS_OAUTH_CLIENT_SECRET != ''
        continue-on-error: true
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888  # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci-dn42
          args: --accept-routes --accept-dns=true

      - name: Tailnet state
        continue-on-error: true
        run: |
          echo "--- tailscale status ---"
          tailscale status || echo "(tailscale not up)"
          echo "--- routes accepted ---"
          ip route  | grep -E '172\.(2[0-3])\.' || echo "(no dn42 v4 route)"
          ip -6 route | grep -iE '^fd' || echo "(no dn42 v6 route)"
          echo "--- resolver config ---"
          resolvectl status tailscale0 2>/dev/null || cat /etc/resolv.conf

      - name: Resolve dn42 names
        continue-on-error: true
        run: |
          for h in burble.dn42 sess.dn42 mashiro.dn42 geofeed.nia.dn42 defelo.dn42; do
            printf '%-26s ' "$h"
            getent hosts "$h" | head -1 || echo "NO RESOLVE"
          done

      - name: Reach the dn42 anycast recursors
        continue-on-error: true
        run: |
          for ip in 172.20.0.53 172.23.0.53; do
            printf '%-16s ' "$ip"
            ping -c1 -W3 "$ip" >/dev/null 2>&1 && echo reachable || echo "no reply"
          done

      - name: Shallow clone DN42 registry
        uses: ./.github/actions/clone-registry
        with:
          registry-url: ${{ secrets.DN42_REGISTRY_URL || vars.DN42_REGISTRY_URL || 'https://git.dn42.dev/dn42/registry.git' }}
          registry-token: ${{ secrets.DN42_REGISTRY_TOKEN }}

      # The summary line is the whole point: "feeds: N fetched, M unreachable"
      # against a baseline of 17 fetched and 22 unreachable.
      - name: Run the sync and report
        run: |
          make sync REGISTRY=registry
          echo "--- snapshot delta against the committed file ---"
          git --no-pager diff --stat -- data/geofeed.csv || true
          echo "rows now: $(($(wc -l < data/geofeed.csv) - 1))"
