name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Code Quality & Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0b9264172d297f9d85790b9b3fa1eb5ec1421c60  # v5.4.0
        with:
          python-version: '3.x'

      - name: Verify build environment
        run: make verify

      - name: Lint GitHub Actions workflows
        uses: rhysd/actionlint@1074e2d312fcf45ff29c62923984ee5315aa975e  # v1.7.7

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Review Dependency Changes
        uses: actions/dependency-review-action@3b13907e59db62f83fdc07dfaa8d8d348a27d2c3  # v4.5.0
